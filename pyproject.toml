[project]
name = "smart-endpointing"
version = "0.0.0"
description = "Turn-detection model that lets a voice agent reply sooner without cutting people off."
requires-python = ">=3.11,<3.12"
# Runtime and dev dependencies are pinned in requirements.txt.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
